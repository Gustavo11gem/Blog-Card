<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog-Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F4D04E]">
    <main
      class="w-[327px] sm:w-[384px] bg-[#ffffff] p-[24px] mt-[156px] mb-[155px] mx-auto rounded-[20px] border border-[#111111] flex flex-col items-start gap-[20px] font-[figtree] shadow-[8px_8px_0px_0px_#000000]"
    >
      <img src="/image/Blog Image.png" alt="" class="sm:hidden" />

      <img src="/image/Blog Image-dk.png" alt="" class="hidden sm:block" />

      <div class="flex flex-col items-start gap-[12px]">
        <button
          class="px-[12px] py-[4px] bg-[##F4D04E] rounded-[4px] font-extrabold text-[12px] sm:text-[14px] text-[#111111]"
        >
          Learning
        </button>

        <p class="font-medium text-[12px] sm:text-[14px] text-[#111111]">
          Published 21 Dec 2023
        </p>

        <h1 class="font-extrabold text-[20px] sm:text-[24px] text-[#111111]">
          HTML & CSS foundations
        </h1>

        <p
          class="font-medium text-[14px] sm:text-[16px] text-[#6B6B6B] leading-[150%]"
        >
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>

      <div class="flex items-center gap-[12px]">
        <img src="/image/userpic.png" alt="" />

        <h4 class="font-extrabold text-[14px] text-[#111111]">Greg Hooper</h4>
      </div>
    </main>
  </body>
</html>
